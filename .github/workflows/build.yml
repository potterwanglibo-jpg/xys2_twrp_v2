name: Build TWRP for XiaoYuan S2 (trinket)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git python3-is-python3 git-lfs rsync liblz4-tool bc bison build-essential ccache curl flex g++ gcc imagemagick libc6-dev libgl1-mesa-dev libglu1-mesa-dev libncurses-dev libreadline-dev libstdc++6 libxml2-utils lzop pngcrush schedtool squashfs-tools unzip x11proto-core-dev xsltproc zip zlib1g-dev lib32ncurses-dev lib32z1-dev libssl-dev
          git lfs install

      - name: Setup repo
        run: |
          mkdir -p $HOME/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > $HOME/bin/repo
          chmod a+x $HOME/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Initialize AOSP TWRP minimal manifest
        run: |
          mkdir -p twrp
          cd twrp
          repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-11
          # Fix SSH to HTTPS
          sed -i 's|ssh://git@github.com/|https://github.com/|g' .repo/manifests/default.xml
          sed -i 's|ssh://git@github.com/|https://github.com/|g' .repo/manifest.xml

      - name: Repo sync
        run: |
          cd twrp
          repo sync -c --no-clone-bundle --no-tags --optimized-fetch --prune --force-sync -j$(nproc)

      - name: Install device tree from checkout
        run: |
          mkdir -p twrp/device/xiaoyuan/s2
          cp -r device/xiaoyuan/s2/* twrp/device/xiaoyuan/s2/
          # Decompress kernel
          gunzip -k twrp/device/xiaoyuan/s2/prebuilt/kernel.gz
          ls -la twrp/device/xiaoyuan/s2/
          ls -la twrp/device/xiaoyuan/s2/prebuilt/

      - name: Clone vendor/omni and fix build conflict
        run: |
          cd twrp
          git clone https://github.com/TeamWin/android_vendor_omni.git vendor/omni -b android-11
          rm -rf vendor/omni/build
          ls vendor/omni/build 2>/dev/null && echo "BUILD DIR STILL EXISTS" || echo "OK: vendor/omni/build removed"

      - name: Build recovery
        run: |
          cd twrp
          export ALLOW_MISSING_DEPENDENCIES=true
          . build/envsetup.sh
          lunch twrp_s2-eng
          mka recoveryimage -j$(nproc)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: twrp-s2
          path: twrp/out/target/product/s2/recovery.img
